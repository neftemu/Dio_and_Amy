  li a { display:block; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:16px 20px;
         margin-bottom:12px; color:var(--text); text-decoration:none; box-shadow:0 4px 16px rgba(92,64,54,.07); }

  li strong { color:var(--brand); display:block; }
  li span { color:var(--muted); font-size:.92rem; }
